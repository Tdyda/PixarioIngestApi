services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:9.5
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: Pixario.Ingest.Api/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:${API_PORT}
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - comfyui_input:/data/input
      - comfyui_output:/opt/ComfyUI/output
      - /var/log/pixario/api:/app/logs

  worker:
    build:
      context: .
      dockerfile: Pixario.Ingest.Worker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_ENVIRONMENT: Docker
    volumes:
      - comfyui_input:/data/input
      - comfyui_output:/data/output
      - "${WORKFLOW_PATH_HOST}:/data/workflows/beauty_retouch.json:ro"
      - /var/log/pixario/worker:/app/logs

  comfyui:
    build:
      context: .
      dockerfile: comfyui/Dockerfile
    container_name: comfyui
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    environment:
      CLI_ARGS: "--listen 0.0.0.0 --port 8188"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - comfyui_models:/opt/ComfyUI/models
      - comfyui_input:/opt/ComfyUI/input
      - comfyui_output:/opt/ComfyUI/output
      - comfyui_user:/opt/ComfyUI/user
      - comfyui_custom_nodes:/opt/ComfyUI/custom_nodes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped

volumes:
  mysqldata:
  uploads:
  comfyui_models:
  comfyui_input:
  comfyui_output:
  comfyui_user:
  comfyui_custom_nodes: